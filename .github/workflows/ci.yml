name: CI

on:
  push:
    branches: [main]
  pull_request:

# Netlify already builds every push; this exists to fail a PR before it merges.
# A newer push to the same branch makes the running check redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Le garde-fou pose son rapport en commentaire sur la PR. C'est toute la
      # raison de ce bloc — sans lui, GITHUB_TOKEN est en lecture seule.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json#packageManager, so CI and
      # Netlify can't drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheapest first: formatting, then types, then the real build.
      - run: pnpm run format:check

      - run: pnpm run check

      # Fully offline: cover art is committed under src/content/now/images/ and
      # refreshed by `pnpm covers`, so nothing here calls a third-party API. A
      # failure at this step is ours.
      - run: pnpm build

      # ─── Garde-fou ────────────────────────────────────────────────────────
      # Everything below reads the dist/ the build just produced, and NONE of it
      # fails the job: findings land in a PR comment where the Merge button is,
      # and a human decides. The blocking half of the contract is `pnpm build`
      # itself — a malformed pubDate never reaches dist/. See CLAUDE.md.
      #
      # Still fully offline: axe runs in jsdom, not a browser, and lychee runs
      # with --offline. The only download is the lychee binary, pulled from a
      # GitHub release by the action — same class as actions/checkout.

      - name: Garde-fou — liens internes
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir is what maps the site's slash-less hrefs (`/blog`) onto
          # dist/blog/index.html. The exclusion is mandatory, not tidy-up:
          # /.netlify/images?url=… is the Netlify Image CDN, written into every
          # srcset on the Now pages and served at request time, so it correctly
          # does not exist in dist/. Without it, 206 red lines on the first run.
          args: >-
            --offline --no-progress --include-fragments
            --root-dir ${{ github.workspace }}/dist
            --exclude '\.netlify/images'
            'dist/**/*.html' 'dist/**/*.xml'
          output: lychee-out.md
          fail: false

      - name: Garde-fou — a11y, contenu, poids
        env:
          GUARD_LIENS: ${{ steps.lychee.outputs.exit_code }}
        run: node scripts/guard.mjs > guard-out.md

      - name: Garde-fou — rapport
        env:
          GH_TOKEN: ${{ github.token }}
          LIENS: ${{ steps.lychee.outputs.exit_code }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Le marqueur identifie le commentaire à réécrire : un seul
          # commentaire par PR, mis à jour en place, jamais empilé.
          {
            echo '<!-- garde-fou -->'
            echo '### Garde-fou'
            echo
            cat guard-out.md
            if [ "${LIENS:-0}" != "0" ]; then
              echo
              echo '<details><summary>Liens cassés (lychee)</summary>'
              echo
              cat lychee-out.md
              echo
              echo '</details>'
            fi
          } > rapport.md

          # La trace intégrale, y compris sur un push direct vers main où il
          # n'y a pas de PR à commenter.
          cat rapport.md >> "$GITHUB_STEP_SUMMARY"

          [ -n "${PR:-}" ] || exit 0

          existant=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq 'map(select(.body | startswith("<!-- garde-fou -->"))) | .[0].id // empty')

          if [ -n "$existant" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existant" -F body=@rapport.md
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@rapport.md
          fi
