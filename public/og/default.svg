<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ember1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb24d" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#ff772c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff772c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#e8551f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8551f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a1a"/>

  <!-- Ember glows rising from the bottom -->
  <circle cx="980" cy="560" r="220" fill="url(#ember1)"/>
  <circle cx="1080" cy="430" r="140" fill="url(#ember2)"/>
  <circle cx="880" cy="470" r="90" fill="url(#ember2)"/>
  <circle cx="1120" cy="600" r="120" fill="url(#ember1)"/>

  <!-- Small bright ember cores -->
  <g fill="#ffd9a0">
    <circle cx="980" cy="540" r="3.5" fill-opacity="0.95"/>
    <circle cx="1075" cy="440" r="2.5" fill-opacity="0.9"/>
    <circle cx="900" cy="480" r="2" fill-opacity="0.85"/>
    <circle cx="1130" cy="585" r="3" fill-opacity="0.9"/>
    <circle cx="1010" cy="380" r="2" fill-opacity="0.8"/>
  </g>

  <!-- Text -->
  <text x="90" y="300" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
        font-size="92" font-weight="700" fill="#fafafa" letter-spacing="1">William Leemans</text>

  <text x="92" y="360" font-family="'IBM Plex Mono', 'Menlo', monospace"
        font-size="34" fill="#9a9a9a">Architecte logiciel &#183; CTO chez Jetdev</text>

  <!-- Accent rule -->
  <rect x="92" y="392" width="120" height="3" fill="#ff772c"/>

  <text x="92" y="560" font-family="'IBM Plex Mono', 'Menlo', monospace"
        font-size="26" fill="#ff8a4c" letter-spacing="2">lmns.fr</text>
</svg>
