<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
    <g stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 32 L33 96 L45 60 L57 96 L72 32" />
        <path d="M88 32 L88 96 L110 96" />
    </g>
    <style>
        /* Brass, the site's single accent. The light value is --color-brass-ink:
           true brass manages only 1.9:1 on a light tab strip, this one 4.7:1.
           Keep both in step with global.css — an SVG can't read the tokens.
           This file is the source for public/apple-touch-icon.png; regenerate
           with `pnpm icons` after editing. */
        g { stroke: #8f6a1a; }
        @media (prefers-color-scheme: dark) {
            g { stroke: #E4A94D; }
        }
    </style>
</svg>
